<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Factory Control</title>
<style>
:root{
  --bg:#1c1f29; --panel:#242834; --panel2:#2e3342; --line:#3a4052;
  --text:#eef0f5; --muted:#9aa1b4; --lime:#B6FF00; --violet:#7D53FF; --coral:#FF6B4A;
  --todo:#6b7287; --prog:#7D53FF; --review:#ffb020; --blocked:#FF6B4A; --done:#B6FF00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Readex Pro",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;font-weight:700}
h1 span{color:var(--lime)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button,.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
nav button.on{background:var(--violet);border-color:var(--violet)}
.btn.lime{background:var(--lime);color:#111;border-color:var(--lime);font-weight:600}
.btn:hover,nav button:hover{filter:brightness(1.15)}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
#banner{display:none;margin:12px 20px 0;padding:12px 14px;border-radius:10px;background:#3a2620;border:1px solid var(--coral);color:#ffd8cf}
#banner code{background:#0003;padding:1px 6px;border-radius:4px}
.sm{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.big{font-size:28px;font-weight:700}
.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px;display:flex}
.bar i{display:block;height:100%}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
select,input,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;width:100%}
.filters select{width:auto}
/* map */
.phase{display:grid;grid-template-columns:230px 1fr;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.phase h3{font-size:15px}
.phase .goal{color:var(--muted);font-size:12px;margin:2px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.chip{border:1px solid var(--line);border-left:4px solid var(--todo);background:var(--panel2);border-radius:8px;padding:7px 10px;cursor:pointer;max-width:330px}
.chip:hover{border-color:var(--muted)}
.chip .t{font-size:13px}
.chip .m{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px}
.chip.waiting{opacity:.55}
/* plan table */
.ptable{margin-bottom:14px}
.ptable .phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ptable h3{font-size:15px}.ptable .goal{color:var(--muted);font-size:12px;margin-top:2px}
.tscroll{overflow-x:auto;margin-top:10px}
.ptable table{width:100%;border-collapse:collapse;min-width:900px}
.ptable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.ptable td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.ptable tr.waiting td{opacity:.6}
.ptable a{color:var(--text);text-decoration:none;font-weight:600}.ptable a:hover{color:var(--lime)}
.ptable select{width:auto;padding:3px 6px;font-size:12px}
.ptable .tmono{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:nowrap}.ptable .tsmall{font-size:12px;max-width:260px}.ptable .tnw{white-space:nowrap}
.dep{display:inline-block;font:11px ui-monospace,Menlo,monospace;padding:1px 6px;border-radius:5px;background:var(--panel2);color:var(--review)}
.dep.ok{color:var(--done)}
/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:200px}
.col h4{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between}
.col.drop{outline:2px dashed var(--lime)}
.col .chip{max-width:none;margin-bottom:8px}
/* owners */
.own-Hesham{color:var(--lime)} .own-Claude{color:#b9a3ff} .own-Hermes{color:#5fd3ff}
/* panel */
#edit{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:.2s;z-index:10;padding:18px;overflow:auto}
#edit.open{transform:none}
#edit h2{font-size:16px;margin-bottom:12px}
.f{margin-bottom:11px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:8px}
textarea{min-height:70px;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
.next li{margin:6px 0 6px 18px}
.reel{display:grid;grid-template-columns:300px 1fr;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.reel video{width:100%;border-radius:10px;background:#000;aspect-ratio:9/16}
.reel h3{font-size:16px;margin-bottom:6px}
.state{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.state.ready{background:var(--lime);color:#111}.state.run{background:var(--violet)}.state.bad{background:var(--coral);color:#111}.state.done{background:#2f6;color:#111}.state.idle{background:var(--panel2);color:var(--muted)}
.reel textarea{min-height:110px;margin:10px 0 8px}
.hint{color:var(--muted);font-size:12px;line-height:1.5}
.inbox{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.inbox .card{display:flex;align-items:center;gap:12px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);white-space:pre-wrap;background:var(--panel2);border-radius:8px;padding:8px;margin-top:8px;max-height:120px;overflow:auto}
@media (max-width:760px){.reel{grid-template-columns:1fr}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;display:none;z-index:20}
.hidden{display:none}
@media (max-width:760px){.phase{grid-template-columns:1fr}header{padding:12px 16px}main{padding:14px 16px 60px}}
</style>
<link rel="stylesheet" href="iraqi.css">
</head>
<body>
<header>
  <h1>Reel Factory <span>Control</span></h1>
  <span class="pill" id="ver">—</span>
  <nav><button onclick="location.href='/'">الرئيسية</button>
    <button data-v="reels" class="on">Reels</button>
    <button data-v="table">Plan table</button>
    <button data-v="map">Plan map</button>
    <button data-v="board">Task board</button>
    <button data-v="spend">Spend</button>
    <button data-v="results">Results</button>
    <button data-v="log">Activity</button>
  </nav>
  <a class="btn lime" href="make.html" style="text-decoration:none">+ New reel</a>
  <button class="btn" id="add">+ New task</button>
</header>
<div id="banner"></div>
<main>
  <div class="summary" id="summary"></div>
  <div class="filters">
    <span class="label">Owner</span>
    <select id="fOwner"><option value="">Everyone</option></select>
    <span class="label">Status</span>
    <select id="fStatus"><option value="">All</option></select>
    <input id="fText" placeholder="Search tasks…" style="max-width:260px">
    <button class="btn" id="reload">Reload</button>
  </div>
  <section id="v-reels"></section>
  <section id="v-table" class="hidden"></section>
  <section id="v-map" class="hidden"></section>
  <section id="v-board" class="hidden"><div class="board" id="board"></div></section>
  <section id="v-spend" class="hidden"></section>
  <section id="v-results" class="hidden"></section>
  <section id="v-log" class="hidden"></section>
</main>

<aside id="edit">
  <h2 id="eTitle">Task</h2>
  <div class="f"><label>Title</label><input id="e_title"></div>
  <div class="row">
    <div class="f" style="flex:1"><label>Phase</label><select id="e_phase"></select></div>
    <div class="f" style="flex:1"><label>Owner</label><select id="e_owner"></select></div>
    <div class="f" style="flex:1"><label>Status</label><select id="e_status"></select></div>
  </div>
  <div class="f"><label>Waits on (task IDs, comma-separated)</label><input id="e_depends" placeholder="T04, T15"></div>
  <div class="f"><label>Done when</label><textarea id="e_done"></textarea></div>
  <div class="f"><label>Notes / instructions</label><textarea id="e_notes"></textarea></div>
  <div class="f"><label>Evidence (file path or link that proves it's done)</label><input id="e_evidence"></div>
  <div class="row" style="margin-top:6px">
    <button class="btn lime" id="eSave">Save</button>
    <button class="btn" id="eCancel">Close</button>
    <button class="btn" id="eDel" style="margin-left:auto;color:var(--coral)">Delete</button>
  </div>
  <p style="color:var(--muted);font-size:12px;margin-top:14px" id="eMeta"></p>
</aside>
<div class="toast" id="toast"></div>

<script>
const COLORS={todo:'var(--todo)',in_progress:'var(--prog)',review:'var(--review)',blocked:'var(--blocked)',done:'var(--done)'};
const NAMES={todo:'To do',in_progress:'In progress',review:'Built, needs your OK',blocked:'Blocked',done:'Done'};
const MONTHLY_CAP=50;
let D=null, view='reels', editing=null, R=null, typing={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}
function now(){return new Date().toISOString().slice(0,16)}

async function load(){
  try{
    const r=await fetch('/api/tasks',{cache:'no-store'}); if(!r.ok) throw 0;
    D=await r.json(); $('#banner').style.display='none';
  }catch(e){
    $('#banner').innerHTML='Not connected to the local server, so nothing can be saved. In Terminal run <code>python3 dashboard/serve.py</code> from the Reel-Factory folder, then open <code>http://127.0.0.1:8766</code>.';
    $('#banner').style.display='block'; D=D||{tasks:[],phases:[],owners:[],statuses:Object.keys(NAMES),log:[]};
  }
  fillSelects(); render();
}
async function persist(msg){
  const r=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(D)});
  const j=await r.json().catch(()=>({}));
  if(r.status===409){toast('Someone else changed the board. Reloading — please redo your change.');await load();return false}
  if(!r.ok){toast('Not saved: '+(j.error||r.status));return false}
  D.version=j.version; toast(msg||'Saved'); render(); return true;
}
function fillSelects(){
  const o=D.owners||[], s=D.statuses||Object.keys(NAMES), p=D.phases||[];
  const keep=(sel,html)=>{const v=sel.value;sel.innerHTML=html;sel.value=v};
  keep($('#fOwner'),'<option value="">Everyone</option>'+o.map(x=>`<option>${esc(x)}</option>`).join(''));
  keep($('#fStatus'),'<option value="">All</option>'+s.map(x=>`<option value="${x}">${NAMES[x]||x}</option>`).join(''));
  $('#e_owner').innerHTML=o.map(x=>`<option>${esc(x)}</option>`).join('');
  $('#e_status').innerHTML=s.map(x=>`<option value="${x}">${NAMES[x]||x}</option>`).join('');
  $('#e_phase').innerHTML=p.map(x=>`<option value="${x.id}">${esc(x.id+' · '+x.name)}</option>`).join('');
}
const byId=id=>D.tasks.find(t=>t.id===id);
const finished=x=>x&&(x.status==='done'||x.status==='review');   // built work counts, even before Hesham's OK
const waiting=t=>t.status!=='done'&&(t.depends||[]).some(d=>{const x=byId(d);return x&&!finished(x)});
function shown(){
  const o=$('#fOwner').value,s=$('#fStatus').value,q=$('#fText').value.toLowerCase();
  return D.tasks.filter(t=>(!o||t.owner===o)&&(!s||t.status===s)&&(!q||(t.title+' '+t.notes+' '+t.id).toLowerCase().includes(q)));
}
function chip(t){
  const w=waiting(t);
  return `<div class="chip${w?' waiting':''}" draggable="true" data-id="${t.id}" style="border-left-color:${COLORS[t.status]}">
    <div class="t">${esc(t.title)}</div>
    <div class="m"><span>${t.id}</span><span class="own-${esc(t.owner)}">● ${esc(t.owner)}</span><span>${NAMES[t.status]}</span>${w?'<span>⏳ waits on '+esc(t.depends.join(', '))+'</span>':''}</div></div>`;
}
function stackBar(list){
  const n=list.length||1;
  return '<div class="bar">'+Object.keys(NAMES).map(s=>`<i style="width:${100*list.filter(t=>t.status===s).length/n}%;background:${COLORS[s]}"></i>`).join('')+'</div>';
}
function summary(){
  const all=D.tasks, done=all.filter(t=>t.status==='done').length, rev=all.filter(t=>t.status==='review');
  const built=done+rev.length, pct=all.length?Math.round(100*built/all.length):0;
  const open=o=>all.filter(t=>t.owner===o&&['todo','in_progress','blocked'].includes(t.status)&&t.phase!=='P7'&&!waiting(t));
  const later=all.filter(t=>t.phase==='P7'&&t.status!=='done'&&t.status!=='review').length;
  const list=r=>r.slice(0,3).map(t=>`<div class="sm">• ${esc(t.title)}</div>`).join('')+(r.length>3?`<div class="sm">+ ${r.length-3} more</div>`:'');
  const me=open('Hesham'), cl=open('Claude');
  $('#summary').innerHTML=`
   <div class="card"><div class="label">Built so far</div><div class="big">${pct}%</div>${stackBar(all)}<div class="sm" style="margin-top:6px">${built} of ${all.length} tasks built · ${done} marked done by you</div></div>
   <div class="card"><div class="label" style="color:var(--review)">Needs your OK</div><div class="big">${rev.length}</div><div class="sm">Finished and working. Check them, then set them to Done.</div>
     <div class="row" style="margin-top:8px;gap:6px;display:flex;flex-wrap:wrap"><button class="btn" id="showRev">Show them</button>${rev.length?'<button class="btn" id="allDone">Mark all done</button>':''}</div></div>
   <div class="card"><div class="label own-Hesham">Your turn</div><div class="big">${me.length}</div>${list(me)||'<div class="sm">Nothing for you right now</div>'}</div>
   <div class="card"><div class="label own-Claude">Claude next</div><div class="big">${cl.length}</div>${list(cl)||'<div class="sm">Nothing waiting</div>'}</div>
   <div class="card"><div class="label">Parked for later</div><div class="big">${later}</div><div class="sm">Ideas kept for later (phase P7). Nothing to do now.</div></div>
   <details class="card howto" style="grid-column:1/-1"><summary><b>How to read this board</b></summary>
     <div class="sm" style="margin-top:8px;display:grid;gap:4px">
       <div><b>To do</b>: not started. <b>In progress</b>: being worked on. <b>Blocked</b>: stuck, waiting for an answer.</div>
       <div><b>Built, needs your OK</b>: Claude finished it and it works. Only you set <b>Done</b>, after you've checked it (or trust it): click <b>Mark all done</b>, or change one in the Plan table.</div>
       <div><b>Your turn</b>: questions only you can answer or things only you can do on your Mac. <b>Claude next</b>: what Claude can start now.</div>
       <div><b>⏳ waits on</b>: that task can't start until the one it names is built.</div>
       <div>Phases: P0 your answers · P1 clean-up · P2 visuals · P3 making reels · P4 quality checks · P5 costs · P6 real reels · P7 later · P8 independent + smarter.</div>
     </div></details>`;
  $('#ver').textContent='board v'+(D.version??'—');
  $('#showRev').onclick=()=>{view='table';$('#fStatus').value='review';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v==='table'));render()};
  const ad=$('#allDone'); if(ad) ad.onclick=async()=>{
    if(!confirm(`Mark all ${rev.length} built tasks as Done? (Only if you're happy with how Reel Factory works now.)`))return;
    rev.forEach(t=>{t.status='done';t.updated=now().slice(0,10);logc(t,'marked done (all built work accepted)')});
    await persist(rev.length+' tasks marked done');
  };
}
function renderMap(){
  const list=shown();
  $('#v-map').innerHTML=(D.phases||[]).map(p=>{
    const all=D.tasks.filter(t=>t.phase===p.id), mine=list.filter(t=>t.phase===p.id);
    const d=all.filter(t=>t.status==='done').length;
    return `<div class="phase"><div><h3>${esc(p.id+' · '+p.name)}</h3><div class="goal">${esc(p.goal)}</div>
      <div class="label">${d}/${all.length} done</div>${stackBar(all)}</div>
      <div class="chips">${mine.map(chip).join('')||'<span style="color:var(--muted)">No tasks match the filter</span>'}</div></div>`}).join('');
}
function renderTable(){
  const list=shown(), sel=s=>`<select class="tstatus" aria-label="Status">${(D.statuses||Object.keys(NAMES)).map(x=>`<option value="${x}"${x===s?' selected':''}>${NAMES[x]||x}</option>`).join('')}</select>`;
  $('#v-table').innerHTML=(D.phases||[]).slice().reverse().map(p=>{
    const rows=list.filter(t=>t.phase===p.id); if(!rows.length) return '';
    const all=D.tasks.filter(t=>t.phase===p.id), d=all.filter(t=>t.status==='done').length;
    return `<div class="card ptable"><div class="phead"><div><h3>${esc(p.id+' · '+p.name)}</h3><div class="goal">${esc(p.goal)}</div></div><div class="label">${d}/${all.length} done</div></div>${stackBar(all)}
    <div class="tscroll"><table><tr><th>ID</th><th>Task</th><th>Owner</th><th>Status</th><th>Waits on</th><th>Done when</th><th>Evidence / notes</th><th>Updated</th></tr>
    ${rows.map(t=>{const w=waiting(t);return `<tr data-id="${t.id}" class="${w?'waiting':''}"><td class="tmono">${t.id}</td>
      <td><a href="#" class="topen">${esc(t.title)}</a></td><td class="own-${esc(t.owner)}">${esc(t.owner)}</td>
      <td class="tnw"><span class="dot" style="background:${COLORS[t.status]}"></span> ${sel(t.status)}</td>
      <td>${(t.depends||[]).map(x=>{const y=byId(x);return `<span class="dep${y&&y.status==='done'?' ok':''}">${esc(x)}</span>`}).join(' ')||'—'}</td>
      <td class="tsmall">${esc(t.done_when||'')}</td><td class="tsmall">${esc(t.evidence||'')}${t.evidence&&t.notes?'<br>':''}<span style="color:var(--muted)">${esc(t.notes||'')}</span></td>
      <td class="tsmall tmono">${esc(t.updated||'')}</td></tr>`}).join('')}</table></div></div>`}).join('')||'<div class="card">No tasks match the filter</div>';
  document.querySelectorAll('#v-table tr[data-id]').forEach(tr=>{
    const t=byId(tr.dataset.id);
    tr.querySelector('.topen').onclick=e=>{e.preventDefault();openEdit(t.id)};
    tr.querySelector('.tstatus').onchange=e=>{const v=e.target.value;logc(t,`status ${t.status} → ${v}`);t.status=v;t.updated=now().slice(0,10);persist(t.id+' → '+(NAMES[v]||v))};
  });
}
function renderBoard(){
  const list=shown();
  $('#board').innerHTML=Object.keys(NAMES).map(s=>{const c=list.filter(t=>t.status===s);
    return `<div class="col" data-s="${s}"><h4><span><span class="dot" style="background:${COLORS[s]}"></span> ${NAMES[s]}</span><span class="pill">${c.length}</span></h4>${c.map(chip).join('')}</div>`}).join('');
  document.querySelectorAll('.col').forEach(col=>{
    col.ondragover=e=>{e.preventDefault();col.classList.add('drop')};
    col.ondragleave=()=>col.classList.remove('drop');
    col.ondrop=e=>{e.preventDefault();col.classList.remove('drop');const t=byId(e.dataTransfer.getData('text'));
      if(t&&t.status!==col.dataset.s){logc(t,`status ${t.status} → ${col.dataset.s}`);t.status=col.dataset.s;t.updated=now().slice(0,10);persist(t.id+' moved')}};
  });
}
async function renderSpend(){
  let e={rows:[]};
  try{e=await (await fetch('/api/expenses',{cache:'no-store'})).json()}catch(_){}
  const rows=e.rows||[], m=new Date().toISOString().slice(0,7);
  const month=rows.filter(r=>(r.date||'').startsWith(m)), tot=month.reduce((a,r)=>a+(+r.amount||0),0);
  const all=rows.reduce((a,r)=>a+(+r.amount||0),0);
  const per={}; month.forEach(r=>per[r.video]=(per[r.video]||0)+(+r.amount||0));
  let sp=null; try{sp=await (await fetch('/api/spend',{cache:'no-store'})).json()}catch(_){}
  const brk=(title,list)=>`<div class="card"><div class="label">${title}</div><table>${(list||[]).map(x=>`<tr><td>${esc(x.name)}</td><td style="text-align:right">$${(+x.amount).toFixed(4)}</td></tr>`).join('')||'<tr><td>No AI calls this month yet</td></tr>'}</table></div>`;
  const extra = sp ? `<div class="summary">
    <div class="card"><div class="label">Average per reel</div><div class="big">$${(+sp.per_reel).toFixed(2)}</div><div class="label">${sp.reels} reel(s) this month</div></div>
    <div class="card"><div class="label">Month-end estimate</div><div class="big">$${(+sp.projection).toFixed(2)}</div><div class="label">at this month's pace (cap $${MONTHLY_CAP})</div></div></div>
    <div class="summary">${brk('By step (this month)',sp.by_step)}${brk('By AI model (this month)',sp.by_model)}</div>
    <p class="label" style="margin:4px 2px 12px">Compare with your Nous portal (portal.nousresearch.com → Billing). Small differences are normal.</p>` : '';
  $('#v-spend').innerHTML=`<div class="summary">
    <div class="card"><div class="label">This month</div><div class="big">$${tot.toFixed(2)}</div><div class="bar"><i style="width:${Math.min(100,100*tot/MONTHLY_CAP)}%;background:${tot>MONTHLY_CAP*.8?'var(--coral)':'var(--lime)'}"></i></div><div class="label" style="margin-top:6px">of $${MONTHLY_CAP} cap</div></div>
    <div class="card"><div class="label">All time</div><div class="big">$${all.toFixed(2)}</div></div>
    <div class="card"><div class="label">Jobs this month</div><div class="big">${Object.keys(per).length}</div></div></div>
    ${extra}
    <div class="card"><table><tr><th>Date</th><th>Job / video</th><th>Category</th><th>Amount</th><th>Note</th></tr>
    ${rows.slice().reverse().map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.video)}</td><td>${esc(r.category)}</td><td>$${(+r.amount||0).toFixed(4)}</td><td style="color:var(--muted)">${esc(r.note)}</td></tr>`).join('')||'<tr><td colspan=5>No spend recorded (expenses.json not found or empty)</td></tr>'}</table></div>`;
}
async function renderResults(){
  let d={reels:[]}; try{d=await (await fetch('/api/performance',{cache:'no-store'})).json()}catch(_){}
  const rows=[]; (d.reels||[]).forEach(r=>{ if(!r.entries.length) rows.push({r,e:null}); r.entries.forEach(e=>rows.push({r,e})); });
  const withData=(d.reels||[]).filter(r=>r.entries.length).length;
  const W={'48h':'2 days','7d':'7 days','30d':'30 days'}, n=v=>v==null?'':Number(v).toLocaleString();
  $('#v-results').innerHTML=`<div class="summary">
    <div class="card"><div class="label">Reels with results</div><div class="big">${withData}</div><div class="label">${withData<5?`Learning starts at 5 reels (${5-withData} to go)`:'Enough to start learning'}</div></div>
    <div class="card"><div class="label">Add results</div><p style="margin:6px 0 0;color:var(--muted)">Open a finished reel on the <a href="/" style="color:var(--lime)">Make a reel</a> page → "How did it do?"</p></div>
    <div class="card"><div class="label">All results</div><p style="margin:6px 0 0"><a href="/api/performance.csv" style="color:var(--lime)">Download as a spreadsheet (CSV)</a></p></div></div>
    <div class="card"><table><tr><th>Reel</th><th>Where / when</th><th>Views</th><th>Avg watched</th><th>To the end</th><th>Saves /1k</th><th>Shares /1k</th><th>Length</th><th>Cards</th><th>Zooms</th><th title="Ready-to-post score (0-100)">Score</th><th>Title</th></tr>
    ${rows.map(({r,e})=>`<tr><td>${esc(r.job)}</td><td>${e?(e.platform==='tiktok'?'TikTok':'Instagram')+' · '+(W[e.when]||e.when):'<span style="color:var(--muted)">no results yet</span>'}</td>
      <td>${e?n(e.views):''}</td><td>${e&&e.watch_pct!=null?e.watch_pct+'%':''}</td><td>${e&&e.full_pct!=null?e.full_pct+'%':''}</td>
      <td>${e&&e.saves_per_1k!=null?e.saves_per_1k:''}</td><td>${e&&e.shares_per_1k!=null?e.shares_per_1k:''}</td>
      <td>${r.facts.length_s?Math.round(r.facts.length_s)+' s':''}</td><td>${r.facts.moments}</td><td>${r.facts.zooms}</td><td>${r.facts.ready_score??'—'}</td><td dir="auto">${esc(r.facts.hook)}</td></tr>`).join('')||'<tr><td colspan=12>No finished reels yet.</td></tr>'}</table></div>`;
}
function renderLog(){
  $('#v-log').innerHTML=`<div class="card"><table><tr><th>When</th><th>Who</th><th>Task</th><th>Change</th></tr>${(D.log||[]).slice().reverse().slice(0,300).map(l=>`<tr><td>${esc(l.time)}</td><td class="own-${esc(l.who)}">${esc(l.who)}</td><td>${esc(l.task)}</td><td>${esc(l.change)}</td></tr>`).join('')}</table></div>`;
}
async function loadReels(){
  try{R=await (await fetch('/api/reels',{cache:'no-store'})).json()}catch(_){R=null}
  if(view==='reels')renderReels();
}
async function act(action,body,msg){
  const r=await fetch('/api/reels/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  toast(j.ok?msg:(j.message||'Could not start')); await loadReels();
}
function renderReels(){
  const el=$('#v-reels');
  if(!R){el.innerHTML='<div class="card">Start the dashboard with <code>python3 dashboard/serve.py</code> to see your reels.</div>';return}
  const cls=s=>({'ready to review':'ready','running':'run','working':'run','needs attention':'bad','final ready':'done'}[s]||'idle');
  let h='<h2 style="font-size:16px;margin-bottom:10px">New footage</h2>';
  h+=R.inbox.length?'<div class="inbox">'+R.inbox.map(i=>`<div class="card"><div><b>${esc(i.slug)}</b><div class="hint">${i.clips} clip(s) in inbox/${esc(i.slug)}</div></div>
     <button class="btn lime" data-start="${esc(i.slug)}" ${R.busy.length?'disabled':''}>${i.running?'Working…':'Make reel'}</button></div>`).join('')+'</div>'
     :'<p class="hint" style="margin-bottom:16px">Put your clips in <b>inbox/&lt;short-name&gt;/clips/</b> (Finder: ReelFactory_project → inbox). They appear here.</p>';
  h+='<h2 style="font-size:16px;margin:6px 0 10px">Your reels</h2>';
  if(!R.reels.length)h+='<p class="hint">No reels yet.</p>';
  for(const r of R.reels){
    const busy=R.busy.length>0, v=r.draft_mtime;
    h+=`<div class="reel"><div>${r.has_draft?`<video controls preload="metadata" src="/media/${r.job}/review/draft_540p.mp4?v=${v}"></video>`:'<div class="card hint" style="aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;text-align:center">No draft yet.<br>It appears here when ready.</div>'}</div>
     <div><h3>${esc(r.job)} <span class="state ${cls(r.state)}">${esc(r.state)}</span></h3>
     <div class="hint">${r.length?`Length ${r.length}s · `:''}Spent $${r.cost.toFixed(3)}${r.qa.length?' · '+r.qa.length+' QA note(s)':''}</div>
     ${r.stop?`<div class="mono">${esc(r.stop)}</div><button class="btn" data-resume="${r.job}" ${busy?'disabled':''} style="margin-top:8px">Try again</button>`:''}
     ${r.state==='running'||r.state==='working'?`<div class="mono">${esc(r.log.join('\n'))}</div>`:''}
     ${r.has_draft&&r.state!=='running'?`
       <textarea id="c-${r.job}" placeholder="What should change? Write it like you'd tell an editor, e.g.\n- hook shorter\n- bigger captions\n- remove the flash at the end\nWrong word in the captions? Write:  old => new">${esc(typing[r.job]||'')}</textarea>
       <div class="row"><button class="btn" data-fix="${r.job}" ${busy?'disabled':''}>Send changes</button>
       <button class="btn lime" data-approve="${r.job}" ${busy?'disabled':''}>Approve → make final videos</button></div>
       <p class="hint" style="margin-top:6px">Changes make a new draft here in a few minutes. Approve makes one high-quality video per platform.</p>`:''}
     ${r.feedback.length?`<div class="hint" style="margin-top:8px"><b>Your earlier comments:</b><br>${r.feedback.slice(-3).map(f=>esc(f.time+': '+f.fix)).join('<br>')}</div>`:''}
     ${r.finals.length?`<div style="margin-top:10px"><b>Final videos:</b> ${r.finals.map(f=>`<a style="color:var(--lime)" href="/media/${r.job}/final/${encodeURIComponent(f)}" download>${esc(f)}</a>`).join(' · ')}</div>`:''}
     ${r.package.length?`<div style="margin-top:10px"><b>For CapCut:</b> ${r.package.map(f=>`<a style="color:var(--lime)" href="/media/${r.job}/edit_package/${f}" download>${f}</a>`).join(' · ')}
       <button class="btn" data-reveal="${r.job}" style="margin-left:8px">Open in Finder</button>
       <div class="hint">Drag 1_video.mp4 to track 1 and 2_graphics.mov above it. They line up by themselves.</div></div>`:''}
     </div></div>`;
  }
  el.innerHTML=h;
  el.querySelectorAll('textarea').forEach(t=>t.oninput=()=>typing[t.id.slice(2)]=t.value);
  el.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>act('start',{slug:b.dataset.start},'Started — you get a notification when the draft is ready'));
  el.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>act('resume',{job:b.dataset.resume},'Trying again'));
  el.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{const t=typing[b.dataset.fix]||'';if(!t.trim()){toast('Write what to change first');return}
    act('fix',{job:b.dataset.fix,text:t},'Working on your changes').then(()=>{typing[b.dataset.fix]=''})});
  el.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>act('reveal',{job:b.dataset.reveal},'Opened in Finder'));
  el.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{if(confirm('Make the final videos for '+b.dataset.approve+'?'))act('approve',{job:b.dataset.approve},'Making the final videos')});
}
function render(){
  summary();
  ['reels','table','map','board','spend','results','log'].forEach(v=>$('#v-'+v).classList.toggle('hidden',v!==view));
  $('.filters').classList.toggle('hidden',!['map','board','table'].includes(view));
  $('#summary').classList.toggle('hidden',view==='reels');
  if(view==='reels'){renderReels();return}
  if(view==='table')renderTable(); if(view==='map')renderMap(); if(view==='board')renderBoard(); if(view==='spend')renderSpend(); if(view==='results')renderResults(); if(view==='log')renderLog();
  document.querySelectorAll('.chip').forEach(c=>{c.onclick=()=>openEdit(c.dataset.id);c.ondragstart=e=>e.dataTransfer.setData('text',c.dataset.id)});
}
function logc(t,change){(D.log=D.log||[]).push({time:now(),who:'Hesham',task:t.id,change})}
function openEdit(id){
  editing=id?byId(id):null; const t=editing||{phase:(D.phases[0]||{}).id,owner:'Hermes',status:'todo',depends:[]};
  $('#eTitle').textContent=editing?`${t.id} — edit task`:'New task';
  $('#e_title').value=t.title||''; $('#e_phase').value=t.phase; $('#e_owner').value=t.owner; $('#e_status').value=t.status;
  $('#e_depends').value=(t.depends||[]).join(', '); $('#e_done').value=t.done_when||''; $('#e_notes').value=t.notes||''; $('#e_evidence').value=t.evidence||'';
  $('#eMeta').textContent=editing?`Last updated ${t.updated||'—'}`:''; $('#eDel').style.display=editing?'':'none';
  $('#edit').classList.add('open'); $('#e_title').focus();
}
$('#eSave').onclick=async()=>{
  const title=$('#e_title').value.trim(); if(!title){toast('A task needs a title');return}
  const v={title,phase:$('#e_phase').value,owner:$('#e_owner').value,status:$('#e_status').value,
    depends:$('#e_depends').value.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean),
    done_when:$('#e_done').value.trim(),notes:$('#e_notes').value.trim(),evidence:$('#e_evidence').value.trim(),updated:now().slice(0,10)};
  let t=editing;
  if(t){const ch=Object.keys(v).filter(k=>JSON.stringify(t[k])!==JSON.stringify(v[k])&&k!=='updated');Object.assign(t,v);if(ch.length)logc(t,'edited: '+ch.join(', '))}
  else{const n=Math.max(0,...D.tasks.map(x=>+x.id.slice(1)||0))+1;t={id:'T'+String(n).padStart(2,'0'),...v};D.tasks.push(t);logc(t,`created, assigned to ${t.owner}`)}
  if(await persist(t.id+' saved'))$('#edit').classList.remove('open');
};
$('#eDel').onclick=async()=>{if(!editing||!confirm('Delete '+editing.id+'?'))return;D.tasks=D.tasks.filter(t=>t!==editing);logc(editing,'deleted');if(await persist('Deleted'))$('#edit').classList.remove('open')};
$('#eCancel').onclick=()=>$('#edit').classList.remove('open');
$('#add').onclick=()=>openEdit(null);
$('#reload').onclick=load;
['#fOwner','#fStatus'].forEach(s=>$(s).onchange=render); $('#fText').oninput=render;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#edit').classList.remove('open')});
setInterval(async()=>{ if($('#edit').classList.contains('open'))return;
  try{const r=await fetch('/api/tasks',{cache:'no-store'});const j=await r.json();if(D&&j.version!==D.version){D=j;render();toast('Board updated (another editor saved)')}}catch(_){}
},15000);
load(); loadReels();
setInterval(()=>{ if(view==='reels' && !document.activeElement.matches('textarea')) loadReels(); },8000);
</script>
</body>
</html>
