<html>
<template>
<style>
#root{position:absolute;inset:0;pointer-events:none}
.__ID__-g{position:absolute;left:var(--text-x);width:var(--text-w);top:var(--cap-top);height:var(--cap-h);display:flex;align-items:center;justify-content:center;direction:rtl;font-family:var(--font);overflow:visible}
.__ID__-pill{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 20px;max-width:100%;padding:14px 30px;border-radius:30px;background:rgba(20,22,30,.62)}
.__ID__-w{color:var(--text);font-size:var(--cap-size,76px);font-weight:600;line-height:1.08;text-shadow:0 4px 18px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.9);display:inline-block}
.__ID__-kw{color:var(--lime);font-weight:700}
</style>
<div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920" data-layout-allow-overflow>
<!--GROUPS-->
</div>
<script>
const tl = gsap.timeline({ paused: true });
// Each group shows while its words are spoken; each word brightens on its own time; keywords turn lime and pop.
document.querySelectorAll(".__ID__-g").forEach((g) => {
  const s = parseFloat(g.dataset.start), e = s + parseFloat(g.dataset.duration);
  tl.fromTo(g, { opacity: 0, y: 26, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.12, ease: "back.out(2)" }, s);
  g.querySelectorAll(".__ID__-w").forEach((w) => {
    const t = parseFloat(w.dataset.t);
    tl.fromTo(w, { opacity: 0.68 }, { opacity: 1, duration: 0.06 }, Math.max(s, t));
    if (w.classList.contains("__ID__-kw")) tl.fromTo(w, { scale: 1 }, { scale: 1.14, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, Math.max(s, t));
  });
  tl.to(g, { opacity: 0, duration: 0.08, ease: "power2.in" }, e - 0.08);
});
window.__timelines["__ID__"] = tl;
</script>
</template>
</html>
